<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Cadastrar Autor</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f7f6;
    padding: 20px;
}

/* TÍTULO */
h1 {
    color: #2e7d32;
}

/* FORM */
form {
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 350px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* INPUTS */
input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

/* BOTÃO */
button {
    background-color: #4CAF50;
    color: white;
    padding: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    font-weight: bold;
}

button:hover {
    background-color: #2e7d32;
}

/* LINK */
a {
    display: inline-block;
    margin-top: 15px;
    color: #2e7d32;
    text-decoration: none;
    font-weight: bold;
}

a:hover {
    text-decoration: underline;
}
</style>

</head>
<body>

<h1>Cadastrar Autor</h1>

<form th:action="@{/cadastrarAutor}" method="post">

    Nome:<br>
    <input type="text" name="nome" required>

    Email:<br>
    <input type="email" name="email" required>

    Data de Nascimento:<br>
    <input type="date" name="dataNascimento" required>

    <button type="submit">Salvar</button>

</form>

<a href="/">⬅ Voltar</a>

</body>
</html>
